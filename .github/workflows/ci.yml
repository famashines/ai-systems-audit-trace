name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: git --redact --verbose --no-banner /github/workspace

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Audit dependencies
        run: npm audit --audit-level=high

  integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        run: npm run test:integration

  gitops-init:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Compare test/integration/mongodb-init.js with gitops main
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The secret GITOPS_TOKEN is not available to this repo on main."
            exit 1
          fi
          gh api "repos/famashines/gitops/contents/kubernetes/ai-systems/ai-systems-mongodb/base/init.js?ref=main" \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/gitops-init.js"
          if ! cmp -s "$RUNNER_TEMP/gitops-init.js" test/integration/mongodb-init.js; then
            echo "::error::test/integration/mongodb-init.js is not the same as gitops main kubernetes/ai-systems/ai-systems-mongodb/base/init.js. Copy the gitops file."
            exit 1
          fi
          echo "test/integration/mongodb-init.js is the same as gitops main."

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build the image
        run: docker build --build-arg RELEASE=${{ github.sha }} --tag ai-systems-audit-trace:ci .
